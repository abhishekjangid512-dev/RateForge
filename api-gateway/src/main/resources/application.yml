server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: api-key-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/clients/**

            - id: protected-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/demo/**